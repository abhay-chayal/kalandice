<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Browser-tab mark: a simple butterfly in the site's gold on deep green.
       The body is cut out in the background colour so the wings still read as
       a butterfly at 16px, where fine detail disappears. -->
  <rect width="64" height="64" rx="14" fill="#193323"/>
  <g fill="#C9A44C">
    <g id="wings">
      <path d="M30 26 C 28 13, 18 6, 12 10 C 5 15, 7 27, 14 31 C 19 34, 26 33, 30 31 Z"/>
      <path d="M30 34 C 26 36, 18 38, 15 43 C 11 49, 16 56, 22 53 C 27 50, 29 42, 30 37 Z"/>
    </g>
    <use href="#wings" transform="translate(64,0) scale(-1,1)"/>
    <!-- antennae -->
    <path d="M31 20 C 28 14, 25 12, 22 11" stroke="#C9A44C" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M33 20 C 36 14, 39 12, 42 11" stroke="#C9A44C" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <circle cx="32" cy="22" r="3"/>
    <rect x="30.2" y="22" width="3.6" height="26" rx="1.8"/>
  </g>
</svg>
